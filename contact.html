<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact ByteVerse | Get in Touch</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="contact.css">
</head>
<body>

<header>
    <nav class="navbar">
        <div class="logo">BYTE<span>VERSE</span></div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
            <li><a href="submissions.html">Admin</a></li>
        </ul>
    </nav>
</header>

<main class="container">
    <header class="contact-header">
        <h1>Connect with the <span>Future</span></h1>
        <p>Our AI engineering team is ready to scale your next digital ecosystem.</p>
    </header>

    <div class="contact-grid">
        <aside class="contact-info">
            <div class="info-box">
                <span class="icon">📍</span>
                <div>
                    <h4>Headquarters</h4>
                    <p>Innovation Drive, Silicon Valley</p>
                </div>
            </div>
            <div class="info-box">
                <span class="icon">✉️</span>
                <div>
                    <h4>General Inquiries</h4>
                    <p>hello@byteverse.ai</p>
                </div>
            </div>
        </aside>

        <div class="glass-card">
            <form id="contactForm">
                <div class="input-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="John Doe" required>
                </div>
                
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="john@example.com" required>
                </div>

                <div class="input-group">
                    <label for="message">Message</label>
                    <textarea id="message" rows="5" placeholder="How can we help you build?" required></textarea>
                </div>

                <button type="submit" class="btn btn-full">Submit Inquiry</button>
                <div id="formStatus" class="status-msg"></div>
            </form>
        </div>
    </div>
</main>

<footer class="footer">
    <p>&copy; 2026 ByteVerse. All Rights Reserved.</p>
</footer>

<script src="script.js"></script>
</body>
</html>
